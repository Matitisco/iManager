name: CI

# PRs run a fast gate (< 5 min): lint, backend unit/integration, frontend unit
# tests (2 shards), PWA asset checks + PWA smoke and an E2E smoke (@smoke,
# Chromium only). The full E2E suite (4 shards) and the full PWA suite
# (iPhone WebKit + Android + desktop) run on every push to main and nightly.
# Browser jobs use the lockfile-matched Playwright image: no apt or browser installs.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # 03:00 Buenos Aires
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/imanager_test
  ENABLE_TEST_AUTH_BYPASS: "true"
  NODE_ENV: test
  # Generate explicitly in backend jobs; postinstall schema lookup depends on INIT_CWD.
  PRISMA_SKIP_POSTINSTALL_GENERATE: "true"
  FULL: ${{ github.event_name != 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.f.outputs.code }}
      playwright-image: ${{ steps.pw.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        name: Detect code changes (docs-only PRs skip the test jobs)
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          echo "$files"
          if echo "$files" | grep -qvE '^(docs/|openspec/|skills/)|\.md$'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - id: pw
        name: Select Playwright image from lockfile
        run: |
          node -e 'const version = require("./package-lock.json").packages["node_modules/@playwright/test"].version; console.log(`image=mcr.microsoft.com/playwright:v${version}-noble`)' >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install frontend and backend dependencies (once per project)
        run: |
          npm ci --prefer-offline --no-audit --no-fund &
          frontend_install=$!
          npm --prefix backend ci --prefer-offline --no-audit --no-fund
          wait "$frontend_install"
      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: backend
      - name: Lint frontend
        run: npm run lint
      - name: Lint backend
        run: npm run lint
        working-directory: backend

  backend-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_DB: imanager_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imanager_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: backend
      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: backend
      - name: Prepare test database
        run: npx prisma db push --skip-generate
        working-directory: backend
      - name: Test backend unit
        run: npm run test:unit
        working-directory: backend
      - name: Test backend integration
        run: npm run test:integration
        working-directory: backend

  frontend-unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.changes.outputs.playwright-image }}
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      # Frontend tests import backend modules (backend deps needed) but use no database.
      # jsdom is the default; layout/animation tests launch real Chromium directly.
      - name: Install frontend and backend dependencies (once per project)
        run: |
          npm ci --prefer-offline --no-audit --no-fund &
          frontend_install=$!
          npm --prefix backend ci --prefer-offline --no-audit --no-fund
          wait "$frontend_install"
      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: backend
      - name: Test frontend
        run: npx vitest run --shard=${{ matrix.shard }}/2

  pwa:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.changes.outputs.playwright-image }}
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Test PWA assets, worker and serving
        run: npm run test:pwa
      - name: PWA smoke (Android Chromium)
        if: env.FULL != 'true'
        run: npm run test:pwa:e2e -- --project=android-chromium --grep @smoke
      - name: Full PWA suite (iPhone WebKit, Android and desktop Chromium)
        if: env.FULL == 'true'
        run: npm run test:pwa:e2e

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.changes.outputs.playwright-image }}
      options: --ipc=host
    env:
      # Service containers are reached by service name from a job container.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/imanager_test
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PR: one smoke job. main / nightly: the full suite in 4 shards.
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[0]' || '[1,2,3,4]') }}
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_DB: imanager_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imanager_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install frontend and backend dependencies (once per project)
        run: |
          npm ci --prefer-offline --no-audit --no-fund &
          frontend_install=$!
          npm --prefix backend ci --prefer-offline --no-audit --no-fund
          wait "$frontend_install"
      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: backend
      # globalSetup prepares this runner's database before the run.
      - name: E2E smoke (@smoke, Chromium)
        if: env.FULL != 'true'
        run: npm run test:e2e -- --grep @smoke
      - name: Full E2E shard
        if: env.FULL == 'true'
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  test:
    name: test
    needs: [changes, lint, backend-tests, frontend-unit, pwa, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e '(.changes.result == "success") and (to_entries | all(.value.result == "success" or .value.result == "skipped"))' \
            || { echo "Required jobs did not all succeed"; exit 1; }
