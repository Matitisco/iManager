name: CI

# PRs run lint/tsc and only related tests. Global config/dependency changes fall
# back to complete suites; UI/assets/E2E changes also run browser smoke.
# Push to main, nightly and dispatch keep full unit/integration, 8 E2E shards
# and all three PWA projects. The required aggregator is always named "test".
# Browser jobs use the lockfile-matched Playwright image.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # 03:00 Buenos Aires
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/imanager_test
  ENABLE_TEST_AUTH_BYPASS: "true"
  NODE_ENV: test
  # Generate explicitly in backend jobs; postinstall schema lookup depends on INIT_CWD.
  PRISMA_SKIP_POSTINSTALL_GENERATE: "true"
  FULL: ${{ github.event_name != 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.f.outputs.plan }}
      frontend: ${{ steps.f.outputs.frontend }}
      backend: ${{ steps.f.outputs.backend }}
      browser: ${{ steps.f.outputs.browser }}
      frontend-shards: ${{ steps.f.outputs.frontend-shards }}
      playwright-image: ${{ steps.pw.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify selection safety
        run: node --test scripts/ci-test-plan.test.mjs
      - id: f
        name: Select tests from the complete PR diff
        env:
          CI_EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-test-plan.mjs
      - id: pw
        name: Select Playwright image from lockfile
        run: |
          node -e 'const version = require("./package-lock.json").packages["node_modules/@playwright/test"].version; console.log(`image=mcr.microsoft.com/playwright:v${version}-noble`)' >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install frontend and backend dependencies (once per project)
        run: |
          npm ci --prefer-offline --no-audit --no-fund &
          frontend_install=$!
          npm --prefix backend ci --prefer-offline --no-audit --no-fund
          wait "$frontend_install"
      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: backend
      - name: Lint frontend
        run: npm run lint
      - name: Lint backend
        run: npm run lint
        working-directory: backend

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_DB: imanager_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imanager_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: backend
      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: backend
      - name: Prepare test database
        run: npx prisma db push --skip-generate
        working-directory: backend
      - name: Test backend unit
        if: needs.changes.outputs.backend == 'full'
        run: npm run test:unit
        working-directory: backend
      - name: Test backend integration
        if: needs.changes.outputs.backend == 'full'
        run: npm run test:integration
        working-directory: backend
      - name: Test related backend unit and integration
        if: needs.changes.outputs.backend == 'related'
        env:
          TEST_PLAN: ${{ needs.changes.outputs.plan }}
        run: |
          node scripts/ci-related-tests.mjs unit
          node scripts/ci-related-tests.mjs integration

  frontend-unit:
    needs: changes
    if: needs.changes.outputs.frontend != 'off'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.changes.outputs.playwright-image }}
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.frontend-shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      # Frontend tests import backend modules (backend deps needed) but use no database.
      # jsdom is the default; layout/animation tests launch real Chromium directly.
      - name: Install frontend and backend dependencies (once per project)
        run: |
          npm ci --prefer-offline --no-audit --no-fund &
          frontend_install=$!
          npm --prefix backend ci --prefer-offline --no-audit --no-fund
          wait "$frontend_install"
      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: backend
      - name: Test frontend
        if: needs.changes.outputs.frontend == 'full'
        run: npx vitest run --shard=${{ matrix.shard }}/2
      - name: Test related frontend
        if: needs.changes.outputs.frontend == 'related'
        env:
          TEST_PLAN: ${{ needs.changes.outputs.plan }}
        run: node scripts/ci-related-tests.mjs frontend

  pwa:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.changes.outputs.playwright-image }}
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(github.event_name == 'pull_request' && '["android-chromium"]' || '["desktop-chromium","iphone-webkit","android-chromium"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Test PWA assets, worker and serving
        run: npm run test:pwa
        if: matrix.project == 'android-chromium'
      - name: PWA smoke (Android Chromium)
        if: env.FULL != 'true'
        run: npm run test:pwa:e2e -- --project=android-chromium --grep @smoke
      - name: Full PWA suite (iPhone WebKit, Android and desktop Chromium)
        if: env.FULL == 'true'
        run: npm run test:pwa:e2e -- --project=${{ matrix.project }}
      - name: Upload PWA report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.changes.outputs.playwright-image }}
      options: --ipc=host
    env:
      # Service containers are reached by service name from a job container.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/imanager_test
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PR: one smoke job. main / nightly: the full suite in 8 shards.
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[0]' || '[1,2,3,4,5,6,7,8]') }}
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_DB: imanager_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imanager_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install frontend and backend dependencies (once per project)
        run: |
          npm ci --prefer-offline --no-audit --no-fund &
          frontend_install=$!
          npm --prefix backend ci --prefer-offline --no-audit --no-fund
          wait "$frontend_install"
      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: backend
      # globalSetup prepares this runner's database before the run.
      - name: E2E smoke (@smoke, Chromium)
        if: env.FULL != 'true'
        run: npm run test:e2e -- --grep @smoke
      - name: Full E2E shard
        if: env.FULL == 'true'
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/8
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  test:
    name: test
    needs: [changes, lint, backend-tests, frontend-unit, pwa, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e '(.changes.result == "success") and (to_entries | all(.value.result == "success" or .value.result == "skipped"))' \
            || { echo "Required jobs did not all succeed"; exit 1; }
